<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyMoney - Пополнение иностранных счетов по СБП</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>HeyMoney</h1>
            <p class="subtitle">Пополнение иностранных счетов по СБП</p>
        </header>

        <main>
            <div class="main-grid">
                <section class="services-section">
                    <h2>Доступные сервисы</h2>
                    <div class="services-dropdown-container">
                        <label for="servicesDropdown">Выберите сервис для просмотра информации:</label>
                        <select id="servicesDropdown" class="form-control services-dropdown">
                            <option value="">-- Выберите сервис --</option>
                        </select>
                        <div id="serviceInfo" class="service-info" style="display: none;">
                            <div class="service-info-content">
                                <h3 id="serviceInfoName"></h3>
                                <p id="serviceInfoDescription"></p>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="calculator-section">
                    <h2>Калькулятор</h2>
                    <div class="calculator-card">
                        <div class="form-group">
                            <label for="serviceSelect">Выберите сервис:</label>
                            <select id="serviceSelect" class="form-control">
                                <option value="">-- Выберите сервис --</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="amountInput">Сумма пополнения (₽):</label>
                            <input 
                                type="number" 
                                id="amountInput" 
                                class="form-control" 
                                placeholder="Введите сумму"
                                min="1"
                                step="0.01"
                            >
                        </div>

                        <button id="calculateBtn" class="btn btn-primary">Рассчитать</button>

                        <div id="result" class="result-container" style="display: none;">
                            <div class="result-card">
                                <h3>Результат расчета</h3>
                                <div class="result-item">
                                    <span class="result-label">Сумма пополнения:</span>
                                    <span class="result-value" id="resultAmount">-</span>
                                </div>
                                <div class="result-item">
                                    <span class="result-label">Комиссия:</span>
                                    <span class="result-value commission" id="resultCommission">-</span>
                                </div>
                                <div class="result-item total">
                                    <span class="result-label">Итого к оплате:</span>
                                    <span class="result-value" id="resultTotal">-</span>
                                </div>
                                <div class="result-description" id="resultDescription"></div>
                            </div>
                        </div>

                        <div id="error" class="error-message" style="display: none;"></div>

                        <div id="loading" class="loading" style="display: none;">
                            <div class="spinner"></div>
                            <p>Расчет...</p>
                        </div>
                    </div>
                </section>
            </div>
        </main>

        <footer>
            <p>&copy; 2024 HeyMoney. Все права защищены.</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
