[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/media/*"
  to = "/media/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "video/mp4; image/png; image/jpeg"
