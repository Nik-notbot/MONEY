<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>heymoney — Пополнение иностранных счетов</title>
	<style>
		body { font-family: system-ui, sans-serif; margin: 0; background: #0b0f19; color: #e6e9ef; }
		.header { padding: 24px; display: flex; justify-content: center; }
		.card { background: #11162a; border: 1px solid #1c2340; border-radius: 16px; padding: 24px; max-width: 520px; margin: 24px auto; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
		.h1 { font-size: 20px; font-weight: 700; margin: 0 0 16px; }
		label { display: block; font-size: 14px; margin: 12px 0 8px; color: #b9c1d6; }
		input, select { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #263056; background: #0e1426; color: #e6e9ef; }
		button { margin-top: 16px; width: 100%; padding: 12px 16px; border-radius: 10px; background: #5b8cfe; border: 0; color: #fff; font-weight: 700; cursor: pointer; }
		button:disabled { opacity: .6; cursor: not-allowed; }
		.list { margin-top: 24px; font-size: 14px; }
		.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #263056; color: #b9c1d6; font-size: 12px; }
		.footer { text-align: center; color: #8a93a8; padding: 24px; }
		.logo { font-weight: 900; letter-spacing: 0.5px; }
	</style>
</head>
<body>
	<div class="header"><div class="logo">heymoney</div></div>
	<div class="card" style="max-width:980px">
		<div class="h1">Магазин услуг пополнения</div>
		<div id="products" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px"></div>
		<hr style="border:none;border-top:1px solid #263056;margin:20px 0"/>
		<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
			<div>
				<div class="h1">Корзина</div>
				<div id="cart"></div>
			</div>
			<div>
				<div class="h1">Оформление</div>
				<form id="checkout-form">
					<label>E-mail</label>
					<input id="email" type="email" required placeholder="you@example.com" />
					<label>Провайдер оплаты</label>
					<select id="provider">
						<option value="redotpay">RedotPay</option>
						<option value="wise">Wise</option>
						<option value="skrill">Skrill</option>
					</select>
					<button id="checkout-btn" type="submit">Перейти к оплате</button>
				</form>
				<div class="list" id="history"></div>
			</div>
		</div>
	</div>
	<div class="footer">Демо интеграция: RedotPay, Wise, Skrill</div>
	<script>
	async function refreshHistory(email){
		const qs = new URLSearchParams({ email });
		const res = await fetch('/api/payments?'+qs);
		const data = await res.json();
		const list = data.payments || [];
		const el = document.getElementById('history');
		el.innerHTML = '<div class="h1" style="margin-top:0">История</div>' + list.map(p=>`<div style="padding:10px;border:1px solid #263056;border-radius:10px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;">
			<div>
				<div><b>${p.provider}</b> · <span class="badge">${p.status}</span></div>
				<div style="color:#8a93a8">${new Date(p.created_at).toLocaleString()} · ${p.external_ref||'-'}</div>
			</div>
			<div><b>${p.amount_rub}</b> ₽</div>
		</div>`).join('');
	}

	// Products and cart
	const state = { products: [], cart: {} };

	function renderProducts(){
		const root = document.getElementById('products');
		root.innerHTML = state.products.map(p=>`
			<div style="border:1px solid #263056;border-radius:14px;overflow:hidden;background:#0e1426">
				<img src="${p.image}" alt="${p.name}" style="width:100%;height:160px;object-fit:cover"/>
				<div style="padding:12px 14px">
					<div style="font-weight:700">${p.name}</div>
					<div style="color:#8a93a8;font-size:13px;margin:6px 0 10px">${p.description||''}</div>
					<div style="display:flex;justify-content:space-between;align-items:center">
						<div><b>${p.price_rub}</b> ₽</div>
						<button data-add="${p.id}" style="width:auto;padding:8px 12px">В корзину</button>
					</div>
				</div>
			</div>
		`).join('');
		root.querySelectorAll('button[data-add]').forEach(btn=>{
			btn.addEventListener('click',()=>{
				const id = btn.getAttribute('data-add');
				state.cart[id] = (state.cart[id]||0) + 1;
				renderCart();
			});
		});
	}

	function renderCart(){
		const root = document.getElementById('cart');
		const entries = Object.entries(state.cart);
		if(entries.length===0){ root.innerHTML = '<div style="color:#8a93a8">Корзина пуста</div>'; return; }
		const byId = Object.fromEntries(state.products.map(p=>[p.id,p]));
		let total = 0;
		root.innerHTML = entries.map(([id,qty])=>{
			const p = byId[id];
			const sum = p.price_rub*qty; total+=sum;
			return `<div style="display:flex;justify-content:space-between;align-items:center;border:1px solid #263056;border-radius:10px;padding:10px;margin:8px 0">
				<div style="display:flex;gap:10px;align-items:center">
					<img src="${p.image}" style="width:48px;height:48px;object-fit:cover;border-radius:8px"/>
					<div>
						<div><b>${p.name}</b></div>
						<div style="color:#8a93a8;font-size:12px">${p.price_rub} ₽ × ${qty}</div>
					</div>
				</div>
				<div>
					<button data-dec="${id}" style="width:auto;padding:6px 10px;margin-right:6px">−</button>
					<button data-inc="${id}" style="width:auto;padding:6px 10px">+</button>
					<div style="margin-top:6px;text-align:right"><b>${sum}</b> ₽</div>
				</div>
			</div>`;
		}).join('') + `<div style="text-align:right;margin-top:10px">Итого: <b>${total}</b> ₽</div>`;
		root.querySelectorAll('button[data-dec]').forEach(btn=>{
			btn.addEventListener('click',()=>{ const id=btn.getAttribute('data-dec'); state.cart[id]=Math.max(0,(state.cart[id]||0)-1); if(state.cart[id]===0) delete state.cart[id]; renderCart(); });
		});
		root.querySelectorAll('button[data-inc]').forEach(btn=>{
			btn.addEventListener('click',()=>{ const id=btn.getAttribute('data-inc'); state.cart[id]=(state.cart[id]||0)+1; renderCart(); });
		});
	}

	async function loadProducts(){
		const res = await fetch('/api/products');
		const data = await res.json();
		state.products = data.products||[];
		renderProducts();
		renderCart();
	}

	document.getElementById('checkout-form').addEventListener('submit', async (e)=>{
		e.preventDefault();
		const email = document.getElementById('email').value.trim();
		const provider = document.getElementById('provider').value;
		const items = Object.entries(state.cart).map(([productId,quantity])=>({ productId, quantity }));
		if(items.length===0){ alert('Корзина пуста'); return; }
		const btn = document.getElementById('checkout-btn');
		btn.disabled=true; btn.textContent='Создание заказа...';
		try{
			const resOrder = await fetch('/api/orders', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email, items }) });
			const orderData = await resOrder.json();
			if(!resOrder.ok) throw new Error(orderData.error||'Ошибка заказа');
			const orderId = orderData.order.id;
			const resCheckout = await fetch(`/api/orders/${orderId}/checkout`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ provider, email }) });
			const chkData = await resCheckout.json();
			if(!resCheckout.ok) throw new Error(chkData.error||'Ошибка оплаты');
			await refreshHistory(email);
			if(chkData.redirectUrl) window.open(chkData.redirectUrl,'_blank');
		} catch(err){
			alert(err.message);
		} finally {
			btn.disabled=false; btn.textContent='Перейти к оплате';
		}
	});

	loadProducts();
	</script>
</body>
</html>
