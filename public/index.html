<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeyMoney - Пополнение иностранных счетов по СБП</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>HeyMoney</h1>
            <p class="subtitle">Пополнение иностранных счетов по СБП</p>
        </header>

        <main>
            <div class="main-grid">
                <section class="services-section">
                    <h2>Доступные сервисы</h2>
                    <div class="services-list-container">
                        <label>Выберите сервис для просмотра информации:</label>
                        <div class="services-list" id="servicesList">
                            <!-- Сервисы будут добавлены через JS -->
                        </div>
                        <select id="servicesDropdown" style="display: none;">
                            <option value="">-- Выберите сервис --</option>
                        </select>
                    </div>
                </section>

                <section class="calculator-section">
                    <h2>Калькулятор</h2>
                    <div class="calculator-card">
                        <div class="form-group amount-fields">
                            <div class="amount-field-row">
                                <div class="amount-field">
                                    <label for="giveInput">Отдаю (₽):</label>
                                    <input 
                                        type="number" 
                                        id="giveInput" 
                                        class="form-control amount-field-input" 
                                        placeholder="Введите сумму"
                                        min="0"
                                        step="0.01"
                                    >
                                </div>
                                <div class="amount-field">
                                    <label for="receiveInput">Получаю (₽):</label>
                                    <input 
                                        type="number" 
                                        id="receiveInput" 
                                        class="form-control amount-field-input" 
                                        placeholder="Введите сумму"
                                        min="0"
                                        step="0.01"
                                    >
                                </div>
                            </div>
                        </div>

                        <div class="form-group" id="emailGroup" style="display: none;">
                            <label for="emailInput">Email <span class="required">*</span>:</label>
                            <input 
                                type="email" 
                                id="emailInput" 
                                class="form-control" 
                                placeholder="example@email.com"
                            >
                        </div>

                        <div class="form-group" id="ibanGroup" style="display: none;">
                            <label for="ibanInput">IBAN <span class="required">*</span>:</label>
                            <input 
                                type="text" 
                                id="ibanInput" 
                                class="form-control" 
                                placeholder="Введите IBAN"
                            >
                        </div>

                        <div class="form-group" id="bep20Group" style="display: none;">
                            <label for="bep20Input">BEP-20 адрес <span class="required">*</span>:</label>
                            <input 
                                type="text" 
                                id="bep20Input" 
                                class="form-control" 
                                placeholder="Введите BEP-20 адрес"
                            >
                        </div>

                        <div class="form-group checkbox-group" id="termsGroup" style="display: none;">
                            <label class="checkbox-label">
                                <input 
                                    type="checkbox" 
                                    id="termsCheckbox" 
                                    class="checkbox-input"
                                >
                                <span class="checkbox-text">Я согласен с условиями пользования <span class="required">*</span></span>
                            </label>
                        </div>

                        <button id="calculateBtn" class="btn btn-primary">Обменять</button>

                        <div id="error" class="error-message" style="display: none;"></div>

                        <div id="loading" class="loading" style="display: none;">
                            <div class="spinner"></div>
                            <p>Расчет...</p>
                        </div>
                    </div>
                </section>
            </div>
        </main>

        <footer>
            <p>&copy; 2024 HeyMoney. Все права защищены.</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
