[build]
  publish = "public"
  command = ""
[
functions]
  directory = "netlify/functions"


# Proxy API to external backend
[[redirects]]
  from = "/api/*"
  to = "https://heymoney-backend.example/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/webhooks/*"
  to = "https://heymoney-backend.example/webhooks/:splat"
  status = 200
  force = true

# Health route fallback (optional)
[[redirects]]
  from = "/health"
  to = "/index.html"
  status = 200

